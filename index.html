<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Techno Function Synth</title>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: one flat colour field, one graph, one formula. Ink on paper, a single dot for time. */
:root{
  --bg:#cfe05e;      /* field, set per scene */
  --ink:#141a05;     /* strokes and text */
  --dot:#e8334f;     /* playhead and play button */
  --faint:rgba(20,26,5,.45);
  --font:"STIX Two Text","Times New Roman",Times,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;
  display:flex;flex-direction:column;transition:background .4s,color .4s;overflow:auto}
.wrap{flex:1;display:flex;flex-direction:column;gap:14px;width:100%;max-width:1180px;margin:0 auto;padding:18px 22px 22px;min-height:560px}
header,.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px}
header{position:relative;justify-content:flex-end;min-height:30px}
#menuBtn{opacity:.75;font-variant-numeric:tabular-nums}
#menuBtn::after{content:" ▾";font-size:.8em}
#menuBtn[aria-expanded="true"]{opacity:1}
#menu{position:absolute;top:100%;right:0;z-index:5;background:var(--bg);border:1.5px solid var(--ink);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-width:230px}
#scenes{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
#scenes button{text-align:left}
#menu .tempo input{flex:1;width:auto}
.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:0;padding:4px 2px;cursor:pointer;opacity:.5}
button:hover{opacity:.8}
button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:1.5px dashed var(--ink);outline-offset:3px}
#play{width:46px;height:46px;border-radius:50%;background:var(--dot);opacity:1;padding:0;display:grid;place-items:center;flex:none}
#play i{display:block;width:0;height:0;border-left:14px solid var(--bg);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
#play.on i{width:14px;height:14px;border:0;background:var(--bg);margin:0}
.tempo{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.tempo input{width:96px}
.tempo span{white-space:nowrap;min-width:4.2em}
main{flex:1;position:relative;min-height:260px;display:flex}
#side{position:relative;width:92px;flex:none}
#plot{position:relative;flex:1;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:manipulation}
/* voice toggles: a label and a small pill switch, aligned with each band */
.tg{position:absolute;right:0;transform:translateY(-50%);display:flex;align-items:center;gap:9px;opacity:1;font-style:italic;font-size:15px;padding:2px 0}
.tg[aria-pressed]{text-decoration:none}
.tg .nm{opacity:.4;transition:opacity .2s}
.tg[aria-pressed="true"] .nm{opacity:1}
.tg.sel .nm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.sw{position:relative;width:28px;height:15px;border:1.5px solid var(--ink);border-radius:99px;transition:background .2s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--ink);transition:transform .2s,background .2s}
.tg[aria-pressed="true"] .sw{background:var(--ink)}
.tg[aria-pressed="true"] .sw i{transform:translateX(13px);background:var(--bg)}
/* sequencer: 16 bars, columns line up with the 16 steps of the graph below */
#seq{display:grid;grid-template-columns:126px repeat(var(--n),minmax(0,56px));row-gap:1px;user-select:none}
#seq[hidden]{display:none}
#bars{display:flex;align-items:center;gap:2px 10px;font-variant-numeric:tabular-nums;padding-left:126px;margin:0 0 -8px;font-size:14px}
#bars span{font-style:italic;opacity:.6;margin-right:2px}
#seq .lab{font-style:italic;text-align:right;padding-right:22px;font-size:13px;line-height:15px;opacity:.75}
#seq .lab.off{opacity:.3}
#seq .num{font-size:12px;opacity:.45;text-align:left;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 0 4px 2px}
#seq .num:hover{opacity:.8}
#seq .num.now{opacity:1;font-weight:600}
#seq .c{height:15px;display:flex;align-items:center;cursor:pointer;padding:0 3px 0 0}
#seq .c::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--ink);opacity:.3;margin-left:1px}
#seq .c.on::after{width:100%;height:3px;border-radius:2px;opacity:.85;margin:0}
#seq .c:hover::after{opacity:.6}
#seq .c.now::after{background:var(--dot);opacity:1}
#seq .num.now{color:var(--dot)}
#seq .row-off .c::after,#seq .c.off::after{opacity:.12}
#formula{font-size:clamp(16px,2.1vw,23px);min-height:2.6em;overflow-x:auto;white-space:nowrap;padding:4px 0}
#formula i{font-style:italic}
#formula sup,#formula sub{font-size:.68em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.15;margin:0 2px}
.fr span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
#presets{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:15px}
select{font:inherit;font-style:italic;color:inherit;background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:3px 2px;cursor:pointer;opacity:.8;max-width:150px}
select:hover,select:focus{opacity:1}
select:focus-visible{outline:1.5px dashed var(--ink);outline-offset:3px}
select option{font-style:normal;color:#111;background:#fff}
#presets span{font-style:italic;opacity:.6;margin-right:-4px}
#presets .gap{width:18px}
[hidden]{display:none!important}
#presets .br{flex-basis:100%;height:0}
#rec.on{opacity:1;color:var(--dot)}
#knobs{padding-left:92px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 26px}
.k label{display:flex;justify-content:space-between;font-style:italic;font-size:15px}
.k output{font-style:normal;font-variant-numeric:tabular-nums;opacity:.7}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:24px;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:1.5px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-6.5px}
input[type=range]::-moz-range-track{height:1.5px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}
.hint{font-size:14px;color:var(--faint);font-style:italic;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu"></button>
    <div id="menu" hidden>
      <div id="scenes" role="group" aria-label="Scene"></div>
      <div class="tempo"><input id="bpm" type="range" min="110" max="160" step="1" aria-label="Tempo"><span id="bpmv"></span></div>
      <div class="tempo"><input id="swing" type="range" min="50" max="72" step="1" aria-label="Swing"><span id="swingv"></span></div>
    </div>
  </header>
  <div id="bars" hidden role="group" aria-label="How many bars in the sequence"><span>sequence</span></div>
  <section id="seq" hidden aria-label="Sequence: which voices play in each bar"></section>

  <main>
    <div id="side" role="group" aria-label="Show or hide voices"></div>
    <div id="plot"><canvas id="cv" tabindex="0" aria-label="Pattern graph. Click to add or remove hits."></canvas></div>
  </main>

  <div id="knobs"></div>

  <div class="bar">
    <button id="play" aria-label="Play"><i></i></button>
    <div id="voices" role="group" aria-label="Voice"></div>
    <div id="presets"></div>
    <span class="sp"></span>
    <button id="new" hidden>new pattern</button>
    <button id="reset" title="forget your changes and load the default patterns and sounds">reset</button>
  </div>

  <div id="formula" aria-live="off"></div>
</div>

<script>
/* ---------- data ---------- */
const TABS=['kick','bass','clap','hat','open','acid'];
const BAND={acid:[.05,.30],open:[.34,.40],hat:[.43,.49],clap:[.52,.58],kick:[.62,.84],bass:[.89,.97]};
const MODES={phrygian:[0,1,3,5,7,8,10,12],minor:[0,2,3,5,7,8,10,12],dorian:[0,2,3,5,7,9,10,12]};
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const hz=m=>440*Math.pow(2,(m-69)/12);       // f = 440 · 2^((n−69)/12)
// TR-808 metal: six square waves at these clashing frequencies (Werner, Abel & Smith 2014)
const METAL=[205.3,304.4,369.6,522.7,540,800];
const DEF={
  kick:[['pitch','pitch',35,70,50,'Hz'],['decay','decay',.1,1.2,.38,'s'],['drive','drive',1,12,2.5,''],['rumble','rumble',0,1,0,''],['level','level',0,1,.9,'']],
  bass:[['cut','cutoff',80,1200,300,'Hz'],['decay','decay',.05,.8,.16,'s'],['level','level',0,1,.6,'']],
  clap:[['tone','tone',600,3000,1100,'Hz'],['decay','decay',.05,.6,.22,'s'],['level','level',0,1,.5,'']],
  hat:[['tone','tone',5000,13000,8500,'Hz'],['decay','decay',.015,.12,.045,'s'],['level','level',0,1,.4,'']],
  open:[['tone','tone',5000,13000,8000,'Hz'],['decay','decay',.1,.8,.3,'s'],['level','level',0,1,.35,'']],
  acid:[['cut','cutoff',100,2000,360,'Hz'],['res','resonance',.5,24,13,''],['env','env mod',0,5000,2400,'Hz'],['decay','decay',.05,.8,.22,'s'],['level','level',0,1,.5,'']]
};
/* Synths for the acid row. Numbers are saved, so the order here never changes; ORDER is what the page shows.
   oct: octave above the root · chord: one note plays this chord (semitones), the old sampled-chord trick
   hold: note lasts the whole step (slide ties it into the next) · set: slider values that suit it */
const SYNTHS=['303','fm bell','pluck','rave stab','supersaw','hoover','dub chord','reese','organ'];
const ORDER=[0,2,6,3,4,5,7,8,1];
const SYN={
  0:{set:{cut:360,res:13,env:2400,decay:.22,level:.5}},
  1:{oct:8,set:{cut:2000,res:1,env:1800,decay:.5,level:.3}},
  2:{oct:4,set:{cut:260,res:9,env:3200,decay:.16,level:.5}},
  3:{oct:4,chord:[0,3,7],set:{cut:700,res:3,env:4200,decay:.2,level:.5}},
  4:{oct:4,hold:1,set:{cut:1500,res:1,env:2500,decay:.5,level:.5}},
  5:{oct:4,hold:1,set:{cut:1400,res:2,env:3000,decay:.3,level:.3}},
  6:{oct:4,chord:[0,3,7,10],set:{cut:320,res:7,env:1500,decay:.4,level:.5}},
  7:{oct:2,hold:1,set:{cut:420,res:4,env:500,decay:.3,level:.36}},
  8:{oct:4,hold:1,set:{cut:2000,res:1,env:0,decay:.2,level:.38}}
};
const defaults=()=>{const p={};for(const v of TABS){p[v]={};for(const d of DEF[v])p[v][d[0]]=d[4]}p.acid.type=0;return p};
const degs=s=>s.c&&s.c.length?s.c:[s.d];          // a step can hold a chord
const clampD=d=>Math.max(0,Math.min(7,d));
const MEL=v=>v==='acid';                // voices that play notes
const ON={};for(const v of TABS)ON[v]=true;       // left switches
const ROWS=['acid','open','hat','clap','kick','bass']; // top to bottom, same as the graph
/* Default 16 bar arrangement: intro, groove, full, break, build, drop. */
const ARR={kick:'xxxxxxxx..xxxxxx',hat:'xxxxxxxxxxxxxxxx',bass:'..xxxxxx..xxxxxx',open:'..xxxxxxxx..xxxx',clap:'....xxxx...xxxxx',acid:'....xxxxxx..xxxx'};

const b=s=>[...s].map(c=>c==='x'?1:0);
const a=s=>s.split(' ').map(t=>t==='-'?null:{d:+t[0],a:t.includes('a'),s:t.includes('s')});
const none='- - - - - - - - - - - - - - - -';
/* Scenes: one per techno style. Tempo, swing (50% straight, 66% triplet), root
   note (MIDI), mode, colours, sound settings and the pattern. */
const SCENES=[
 {name:'150',about:'150 bpm techno: driving distorted kick, rolling bass, acid on top',bpm:150,swing:50,root:28,mode:'phrygian',bg:'#e8334f',ink:'#1a0508',dot:'#f4e9d0',
  set:{kick:{pitch:52,decay:.3,drive:8,rumble:.35},bass:{cut:240,decay:.1},clap:{tone:1300,decay:.18},hat:{tone:10000,decay:.035},acid:{res:17,env:2600,decay:.18,level:.45}},
  pat:{kick:b('x...x...x...x...'),bass:b('.xxx.xxx.xxx.xxx'),clap:b('....x.......x...'),hat:b('xxxxxxxxxxxxxxxx'),open:b('..x...x...x...x.'),acid:a('0a 0 - 0 3s 1 - 0 0a - 0 7s 4 0 1a -')}},
 {name:'detroit',about:'soulful machine funk, swung hats, dorian minor',bpm:128,swing:56,root:29,mode:'dorian',bg:'#1c3fa0',ink:'#f4bfe9',dot:'#7be33a',
  set:{kick:{pitch:52,decay:.32,drive:2},bass:{cut:500},hat:{tone:10000}},
  pat:{kick:b('x...x...x...x...'),bass:b('.xx..xx..xx..xx.'),clap:b('....x.......x...'),hat:b('x.xxx.xxx.xxx.xx'),open:b('..x...x...x...x.'),acid:a(none)}},
 {name:'berlin',about:'dark warehouse: rumbling kick, off-beat bass, phrygian',bpm:134,swing:50,root:30,mode:'phrygian',bg:'#cfe05e',ink:'#141a05',dot:'#e8334f',
  set:{kick:{pitch:46,decay:.45,drive:4,rumble:.55},bass:{cut:200,decay:.14}},
  pat:{kick:b('x...x...x...x...'),bass:b('..x...x...x...x.'),clap:b('............x...'),hat:b('xx.xxx.xxx.xxx.x'),open:b('................'),acid:a(none)}},
 {name:'minimal',about:'less is more: short kick, sparse bass, lots of swing',bpm:125,swing:60,root:33,mode:'minor',bg:'#f3efe4',ink:'#22201c',dot:'#e8334f',
  set:{kick:{pitch:56,decay:.2,drive:1.5},bass:{cut:900,decay:.12},clap:{tone:1500,decay:.12}},
  pat:{kick:b('x...x...x...x...'),bass:b('...x..x....x.x..'),clap:b('....x.......x...'),hat:b('..x...x...x...x.'),open:b('................'),acid:a('- - - - - - - 4 - - - - - - 0a -')}},
 {name:'dub',about:'soft kick, deep sub, endless echo',bpm:120,swing:54,root:26,mode:'minor',bg:'#0f3d3e',ink:'#bde8d8',dot:'#f2c14e',
  set:{kick:{pitch:48,decay:.4,drive:1.5},bass:{cut:160,decay:.35},hat:{tone:7000,level:.3},acid:{cut:500,res:4,env:800,decay:.3,level:.35}},
  pat:{kick:b('x...x...x...x...'),bass:b('x.........x.....'),clap:b('................'),hat:b('xxxxxxxxxxxxxxxx'),open:b('..x...x...x...x.'),acid:a('- - - 0 - - - - - 0 - - - - 0 -')}},
 {name:'acid',about:'a 303 line over a hard 909: turn cutoff and resonance while it plays',bpm:138,swing:52,root:31,mode:'phrygian',bg:'#ee6a3a',ink:'#1d0c05',dot:'#fff3c4',
  set:{kick:{drive:5},acid:{res:16,env:2800}},
  pat:{kick:b('x...x...x...x...'),bass:b('................'),clap:b('....x.......x...'),hat:b('x.xxx.xxx.xxx.xx'),open:b('..x...x...x...x.'),acid:a('0 - 0a 0 - 3s 4 - 0 0a - 7s 4 - 1a 0')}},
 {name:'hard',about:'fast and distorted: pounding kick, rolling bass',bpm:150,swing:50,root:28,mode:'phrygian',bg:'#f2b6e6',ink:'#1b2f8a',dot:'#e8334f',
  set:{kick:{pitch:52,decay:.3,drive:9,rumble:.3},bass:{cut:260,decay:.1}},
  pat:{kick:b('x...x...x...x...'),bass:b('.xxx.xxx.xxx.xxx'),clap:b('....x.......x...'),hat:b('xxxxxxxxxxxxxxxx'),open:b('..x...x...x...x.'),acid:a(none)}},
 {name:'industrial',about:'machines and metal: broken kick, heavy drive',bpm:136,swing:50,root:25,mode:'phrygian',bg:'#9aa0a6',ink:'#111214',dot:'#ff3b1f',
  set:{kick:{pitch:44,decay:.5,drive:11,rumble:.7},clap:{tone:900,decay:.4},hat:{tone:6000}},
  pat:{kick:b('x...x...x..xx...'),bass:b('..x...x...x...x.'),clap:b('....x.......x...'),hat:b('x.x.x.x.x.x.x.x.'),open:b('................'),acid:a(none)}},
 {name:'hypnotic',about:'one short phrase looping until it moves you',bpm:130,swing:52,root:27,mode:'phrygian',bg:'#3b1f5e',ink:'#ffd36e',dot:'#5ef2c2',
  set:{kick:{decay:.42,drive:3,rumble:.45},acid:{res:6,env:1200,decay:.15,cut:400}},
  pat:{kick:b('x...x...x...x...'),bass:b('..x...x...x...x.'),clap:b('................'),hat:b('x.xxx.xxx.xxx.xx'),open:b('..x...x...x...x.'),acid:a('0a - 3 0 - 4 - 0a - 3 0 - 4 - 0a -')}},
 {name:'electro',about:'broken 808 beat, not four on the floor',bpm:128,swing:50,root:28,mode:'minor',bg:'#101820',ink:'#7df9ff',dot:'#ff2e88',
  set:{kick:{pitch:45,decay:.8,drive:1.5},bass:{cut:600,decay:.4}},
  pat:{kick:b('x.....x...x.....'),bass:b('...x......x..x..'),clap:b('....x.......x...'),hat:b('xxx.xxxxxx.xxxx.'),open:b('...............x'),acid:a('- - 0 - - - 7s 4 - - 0a - - - 3 -')}},
 {name:'ambient',about:'deep and slow: half-time kick, long sub',bpm:116,swing:54,root:27,mode:'dorian',bg:'#dfe7f2',ink:'#2a3550',dot:'#e8334f',
  set:{kick:{pitch:46,decay:.45,drive:1.2,level:.7},bass:{cut:180,decay:.7},hat:{level:.25}},
  pat:{kick:b('x.......x.......'),bass:b('x.......x.......'),clap:b('................'),hat:b('..x...x...x...x.'),open:b('................'),acid:a('- - - - 4 - - - - - - 7 - - - -')}}
];
const PICK={1:[12],2:[4,12],4:[0,4,9,12],8:[0,2,4,6,8,10,12,14],16:[...Array(16).keys()]};
let nBars=1;   // sequencer hidden for now: loop one bar, every voice plays
const arrange=s=>{s.arr={};for(const v of TABS)s.arr[v]=PICK[nBars].map(i=>ARR[v][i]==='x'?1:0)};
for(const s of SCENES){s.P=defaults();for(const v in s.set)Object.assign(s.P[v],s.set[v]);arrange(s)}
let scene=SCENES[0],pat=scene.pat,P=scene.P,bpm=scene.bpm,sel='kick';
const SCALE=()=>MODES[scene.mode];
const ROOT=()=>hz(scene.root);

/* ---------- audio ---------- */
let ac,N={},curves={};
// soft clip y = tanh(kx) / tanh(k)
const curve=k=>{k=Math.round(k*4)/4;if(!curves[k]){const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}curves[k]=c}return curves[k]};
const G=v=>{const g=ac.createGain();g.gain.value=v;return g};
const F=(type,f,q)=>{const n=ac.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n};
const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[0]};
// reverb impulse: noise falling 60 dB over rt seconds, h(t) = n(t) · 10^(−3t/rt)
function impulse(rt){const len=ac.sampleRate*rt|0,buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(10,-3*i/len)}return buf}

function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  // master: compressor then soft clip, the usual techno bus glue
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.12;
  const clip=ac.createWaveShaper();clip.curve=curve(1.5);
  N.master=G(1);N.out=G(.8);chain(N.master,comp,clip,N.out,ac.destination);
  // sidechain bus: everything low ducks when the kick hits
  N.duck=G(1);N.duck.connect(N.master);
  // noise source material
  N.noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=N.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // dotted-eighth delay: 60/bpm · 0.75 s
  N.dly=ac.createDelay(1);N.dSend=G(1);const fb=G(.45);
  chain(N.dSend,N.dly,F('highpass',500),G(.5),N.master);N.dly.connect(fb);fb.connect(N.dly);
  // room
  const rv=ac.createConvolver();rv.buffer=impulse(1.6);N.vSend=G(1);chain(N.vSend,rv,F('highpass',600),G(.35),N.master);
  // rumble: kick into reverb, steep lowpass (48 dB), distorted, lowpassed again, ducked
  const rr=ac.createConvolver();rr.buffer=impulse(1.4);const rs=ac.createWaveShaper();rs.curve=curve(5);
  N.rSend=G(1);N.rOut=G(0);chain(N.rSend,rr,F('lowpass',150,.54),F('lowpass',150,1.31),rs,F('lowpass',170,.54),F('lowpass',170,1.31),N.rOut,N.duck);
  // acid: one saw, always running, into a 24 dB resonant lowpass (TB-303 style)
  N.ao=ac.createOscillator();N.ao.type='sawtooth';N.ao.frequency.value=98;
  const as=ac.createWaveShaper();as.curve=curve(2.5);
  N.f1=F('lowpass',400,11);N.f2=F('lowpass',400,.7);N.vca=G(0);N.aLv=G(.5);N.acc=0;

const live=(v,bar)=>ON[v]&&!!scene.arr[v][bar%nBars];   // a voice sounds if its switch is on and its bar is lit
function fire(i,t,bar){

  if(pat.bass[i]&&live('bass',bar))bass(t);
  if(pat.clap[i]&&live('clap',bar))clap(t);
  if(pat.hat[i]&&live('hat',bar))hat(t,P.hat,false);
  if(pat.open[i]&&live('open',bar))hat(t,P.open,true);

/* ---------- clock: schedule 100 ms ahead on the audio clock, poll every 25 ms ----------
   swing pushes every second 16th late by (swing − 50%) · 2 · one step */
let playing=false,step=0,bar=0,nextBar=null,nextT=0,timer,queue=[];
function tick(){
  const sd=60/bpm/4;
  while(nextT<ac.currentTime+.1){
    const sw=step%2?(scene.swing/100-.5)*2*sd:0;fire(step,nextT+sw,bar);queue.push({s:step,b:bar,t:nextT});nextT+=sd;
    if(++step===16){step=0;bar=nextBar!=null?nextBar:(bar+1)%nBars;nextBar=null}
  }
  timer=setTimeout(tick,25);
}
function toggle(){
  initAudio();
  if(playing){clearTimeout(timer);playing=false;queue=[];N.vca.gain.cancelScheduledValues(0);N.vca.gain.setTargetAtTime(0,ac.currentTime,.01)}
  else{ac.resume();step=0;bar=nextBar!=null?nextBar:0;nextBar=null;nextT=ac.currentTime+.06;playing=true;tick()}
  const pb=document.getElementById('play');pb.classList.toggle('on',playing);pb.setAttribute('aria-label',playing?'Stop':'Play');
}

  if(cur!==shownBar){shownBar=cur;for(const el of document.querySelectorAll('#seq [data-b]'))el.classList.toggle('now',+el.dataset.b===cur)}

let shownBar=-1;

/* ---------- editing on the graph ----------
   click empty: add · click a note: remove · drag a note: move it (up/down = pitch, sideways = time)
   drag across empty steps: paint · shift-click: accent · alt-click: slide */
let drag=null,hover=null;
function hit(e){
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const i=Math.floor((x-L)/((W-L-R)/16));if(i<0||i>15)return null;
  const n=(y-T)/(H-T-B);let v=null,best=9;

  ({kick,bass,clap,hat:t=>hat(t,P.hat,false),open:t=>hat(t,P.open,true),acid:t=>{acid(i,t,60/bpm/4);N.vca.gain.setTargetAtTime(0,t+.25,.012)}})[v](t);

cv.addEventListener('contextmenu',e=>e.preventDefault());

  }
});
cv.addEventListener('pointermove',e=>{
  const h=hit(e);
  hover=drag?null:h;
  cv.style.cursor=drag&&drag.mode==='move'?'grabbing':h&&MEL(h.v)&&pat[h.v][h.i]?'grab':'crosshair';
  if(!drag||!h)return;
  if(drag.mode==='move'){
    if(h.i===drag.at&&h.d===drag.d)return;
    // notes the drag passes over come back; only the drop spot is replaced
    if(h.v!==drag.v)return;
    const note=drag.note,dd=h.d-note.d;note.d=h.d;if(note.c)note.c=note.c.map(x=>clampD(x+dd));
    for(let k=0;k<16;k++)pat[drag.v][k]=drag.snap[k];
    pat[drag.v][h.i]=note;
    if(h.d!==drag.d)preview(drag.v,h.i);
    drag.at=h.i;drag.d=h.d;drag.moved=true;
  }else if(MEL(drag.v)){
    if(h.v!==drag.v)return;
    const s=pat[drag.v][h.i];
    if(h.i===drag.at){if(s&&s.d!==h.d){s.d=h.d;delete s.c;preview(drag.v,h.i)}}   // same step: retune while dragging
    else if(!s){pat[drag.v][h.i]={d:h.d,a:false,s:false};preview(drag.v,h.i)}
    drag.at=h.i;
  }else if(h.v===drag.v&&h.i!==drag.at){
    pat[drag.v][h.i]=drag.val;drag.at=h.i;
  }
});
const endDrag=()=>{if(drag&&drag.mode==='move'&&!drag.moved)pat[drag.v][drag.at]=null;drag=null};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{drag=null});
cv.addEventListener('pointerleave',()=>{hover=null});

/* ---------- presets ----------
   SOUNDS change the selected voice's sliders. TUNES are acid lines written as
   scale degree (0 = root … 7 = octave), a = accent, s = slide, - = rest. */
const SOUNDS={
  kick:{'909':{pitch:52,decay:.35,drive:2.5,rumble:0},'808 boom':{pitch:46,decay:1.1,drive:1.2,rumble:0},'rumble':{pitch:46,decay:.45,drive:4,rumble:.6},'hard':{pitch:52,decay:.3,drive:9,rumble:.3},'gabber':{pitch:58,decay:.5,drive:12,rumble:0},'tick':{pitch:60,decay:.15,drive:1.5,rumble:0}},
  bass:{'tight':{cut:260,decay:.1},'warm':{cut:500,decay:.2},'sub':{cut:120,decay:.4},'long':{cut:300,decay:.7}},
  clap:{'909':{tone:1100,decay:.22},'tight':{tone:1500,decay:.1},'big':{tone:950,decay:.5}},
  hat:{'808':{tone:8500,decay:.045},'bright':{tone:11500,decay:.035},'dark':{tone:6000,decay:.06}},
  open:{'short':{tone:9000,decay:.15},'808':{tone:8000,decay:.3},'long':{tone:9000,decay:.7}},
  acid:{'classic':{cut:360,res:13,env:2400,decay:.22},'squelch':{cut:250,res:20,env:4000,decay:.35},'mellow':{cut:500,res:6,env:1200,decay:.3},'screaming':{cut:700,res:24,env:5000,decay:.45},'dark':{cut:150,res:16,env:1500,decay:.15}}
};
const TUNES={
  classic:'0 - 0a 0 - 3s 4 - 0 0a - 7s 4 - 1a 0',
  rolling:'0 0 7 0 0 0a 7 0 0 0 7s 5 0 0a 3 0',
  squelch:'0a 0s 0 - 0a 0s 1 - 0a 0s 0 - 3a 3s 1 -',
  hypnotic:'0a - 3 0 - 4 - 0a - 3 0 - 4 - 0a -',
  rave:'0a 0 7 0 5s 3 0a 0 7 0 5s 3 1a 0 3 0',
  chicago:'0 0a 0 0s 7 0 0a 3 0 0 0a 5s 3 0 1 0',
  walking:'0 1 3 1 0 1a 3 4 3 1 0 1s 3 5 4a 3',
  octaves:'0 7 0 7a 0 7 0 7s 0 7 0 7a 3 7 4 7s',
  minimal:'- - 0 - - - - 4a - - 0 - - - - -'
};
function renderPresets(){
  const opt=(v,t,on)=>`<option value="${v}"${on?' selected':''}>${t}</option>`;
  let h='';
  if(sel==='acid')h+=`<select id="p-synth" aria-label="Synth">`+ORDER.map(k=>opt(k,SYNTHS[k],P.acid.type===k)).join('')+`</select>`;
  if(sel!=='acid'||!P.acid.type)h+=`<select id="p-sound" aria-label="Sound preset">`+opt('','sound',1)+Object.keys(SOUNDS[sel]).map(k=>opt(k,k)).join('')+`</select>`;
  if(MEL(sel))h+=`<select id="p-tune" aria-label="Tune">`+opt('','tune',1)+Object.keys(TUNES).map(k=>opt(k,k)).join('')+`</select>`;
  $('presets').innerHTML=h;
  const on=(id,fn)=>{const el=$(id);if(el)el.onchange=()=>{if(el.value!=='')fn(el.value);el.blur()}};
  on('p-synth',k=>{P.acid.type=+k;Object.assign(P.acid,SYN[P.acid.type].set);applyParams();if(ac)N.vca.gain.setTargetAtTime(0,ac.currentTime,.01);select('acid');preview('acid',pat.acid.findIndex(Boolean))});
  on('p-sound',k=>{Object.assign(P[sel],SOUNDS[sel][k]);select(sel);applyParams();preview(sel,pat[sel].findIndex(Boolean));if($('p-sound'))$('p-sound').value=k});
  on('p-tune',k=>{a(TUNES[k]).forEach((n,i)=>pat.acid[i]=n)});
}

/* ---------- formula and controls ---------- */
const fmt=v=>v>=100?Math.round(v):v>=10?v.toFixed(1):v.toFixed(2);
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const FORM={
  kick:p=>`<i>y</i> = tanh(${fmt(p.drive)} sin 2π∫<i>f</i> d<i>t</i>) · <i>e</i><sup>−5<i>t</i>/${fmt(p.decay)}</sup> ,&emsp;<i>f</i> = ${fmt(p.pitch)}(1 + 5<i>e</i><sup>−<i>t</i>/0.016</sup>) ,&emsp;rumble = ${fmt(p.rumble)} · lp<sub>150</sub>(reverb(<i>y</i>))`,
  bass:p=>`<i>y</i> = lp<sub>${fmt(p.cut)}</sub>(saw(${fmt(ROOT())}<i>t</i>)) · <i>e</i><sup>−3<i>t</i>/${fmt(p.decay)}</sup> · (1 − 0.85 kick)`,
  clap:p=>`<i>y</i> = bp<sub>${fmt(p.tone)}</sub>(noise) · [ Σ<sub><i>k</i>=0..3</sub> (1 − (<i>t</i> − 0.011<i>k</i>)/0.009)<sub>+</sub> + 0.75<i>e</i><sup>−5(<i>t</i>−0.034)/${fmt(p.decay)}</sup> ]`,
  hat:p=>`<i>y</i> = hp( bp<sub>${fmt(p.tone*.835)}</sub>(<i>m</i>) + ¼ bp<sub>3440</sub>(<i>m</i>) ) · <i>e</i><sup>−5<i>t</i>/${fmt(p.decay)}</sup> ,&emsp;<i>m</i> = Σ<sub><i>k</i>=1..6</sub> sq(<i>f<sub>k</sub>t</i>) ,&emsp;<i>f</i> = 205, 304, 370, 523, 540, 800`,
  acid:p=>p.type?SYNTHF[p.type](p):`<i>y</i> = lp<sup>4</sup><sub><i>c</i>(<i>t</i>)</sub>(saw(${fmt(ROOT()*2)} · 2<sup>${fr('<i>n</i>','12')}</sup><i>t</i>)) ,&emsp;<i>c</i>(<i>t</i>) = ${fmt(p.cut)} + ${fmt(p.env)}<i>e</i><sup>−3<i>t</i>/${fmt(p.decay)}</sup> ,&emsp;<i>Q</i> = ${fmt(p.res)}`
};
FORM.open=FORM.hat;
const env=p=>`<i>e</i><sup>−4<i>t</i>/${fmt(p.decay)}</sup>`;
const lpc=p=>`lp<sub>${fmt(p.cut)} + ${fmt(p.env)}<i>e</i><sup>−4<i>t</i>/${fmt(p.decay)}</sup></sub>`;
const cents=c=>`2<sup>${c}/1200</sup>`;
const SYNTHF={
  1:p=>`<i>y</i> = sin(2π<i>ft</i> + <i>I</i>(<i>t</i>) sin(2π·3.5<i>ft</i>)) · <i>e</i><sup>−2<i>t</i>/${fmt(p.decay)}</sup> ,&emsp;<i>I</i>(<i>t</i>) = ${fmt(p.env/600)}<i>e</i><sup>−3<i>t</i>/${fmt(p.decay)}</sup>`,
  2:p=>`<i>y</i> = lp<sub>${fmt(p.cut)} + ${fmt(p.env)}<i>e</i><sup>−9<i>t</i>/${fmt(p.decay)}</sup></sub>(saw(<i>f</i>) + ½ sq(<i>f</i>/2)) · ${env(p)}`,
  3:p=>`<i>y</i> = Σ<sub><i>n</i> ∈ {0,3,7}</sub> ${lpc(p)}(saw(<i>f<sub>n</sub></i>·${cents('±14')}) + ½ sq(<i>f<sub>n</sub></i>)) · ${env(p)} ,&emsp;<i>f<sub>n</sub></i> = <i>f</i>·2<sup><i>n</i>/12</sup>`,
  4:p=>`<i>y</i> = ${lpc(p)}( hp<sub><i>f</i></sub> Σ<sub><i>k</i>=1..7</sub> saw(<i>f</i>(1 + 0.22<i>o<sub>k</sub></i>)) ) ,&emsp;<i>o</i> = 0, ±0.0195, ±0.0629, ±0.1100`,
  5:p=>`<i>y</i> = chorus( ${lpc(p)}( Σ<sub><i>m</i> ∈ {½,1,2}</sub> saw(<i>m f</i>·${cents('±18')}·<i>g</i>(<i>t</i>)) ) ) ,&emsp;<i>g</i>(<i>t</i>) = 2<sup>−<i>e</i><sup>−<i>t</i>/0.045</sup></sup>`,
  6:p=>`<i>y</i> = echo( hp<sub>220</sub> Σ<sub><i>n</i> ∈ {0,3,7,10}</sub> lp<sub><i>c</i>(<i>t</i>)</sub>(saw(<i>f<sub>n</sub></i>·${cents('±7')})) · <i>e</i><sup>−5<i>t</i>/${fmt(p.decay)}</sup> ) ,&emsp;<i>c</i> = ${fmt(p.cut)} → ${fmt(p.cut+p.env)} → ${fmt(p.cut)}`,
  7:p=>`<i>y</i> = lp<sub>${fmt(p.cut)}</sub>(saw(<i>f</i>·${cents('−25')}) + saw(<i>f</i>·${cents('+25')})) + ½ sin(2π·<i>f</i>/2·<i>t</i>) ,&emsp;beat = ${fmt(ROOT()*2*(Math.pow(2,25/1200)-Math.pow(2,-25/1200)))} Hz`,
  8:p=>`<i>y</i> = 0.5 sin(2π<i>ft</i>) + 0.35 sin(2π·2<i>ft</i>) + 0.14 sin(2π·3<i>ft</i>) + 0.1 sin(2π·4<i>ft</i>) + click`
};
const KEYS='asdfghjk';                    // computer keyboard → scale degrees 0–7
let kc=0;                                 // the step the keys write to
const keyVoice=()=>ON.acid?'acid':null;
const $=id=>document.getElementById(id);
function formula(){$('formula').innerHTML=FORM[sel](P[sel])}
function select(v){
  sel=v;
  for(const el of $('voices').children)el.setAttribute('aria-pressed',el.dataset.v===v);
  for(const el of $('side').children)el.classList.toggle('sel',el.dataset.v===v);
  const show=(k,x)=>fmt(x);
  $('knobs').innerHTML=DEF[v].map(d=>`<div class="k"><label for="k-${d[0]}">${d[1]}<output id="o-${d[0]}">${show(d[0],P[v][d[0]])} ${d[5]}</output></label><input id="k-${d[0]}" type="range" min="${d[2]}" max="${d[3]}" step="${(d[3]-d[2])/200}" value="${P[v][d[0]]}"></div>`).join('');
  for(const d of DEF[v])$('k-'+d[0]).oninput=e=>{P[v][d[0]]=+e.target.value;$('o-'+d[0]).textContent=show(d[0],P[v][d[0]])+' '+d[5];formula();applyParams()};
  formula();renderPresets();
}
function setScene(s){
  scene=s;pat=s.pat;P=s.P;bpm=s.bpm;
  const st=document.documentElement.style;st.setProperty('--bg',s.bg);st.setProperty('--ink',s.ink);st.setProperty('--dot',s.dot);
  st.setProperty('--faint',s.ink+'99');
  for(const el of $('scenes').children)el.setAttribute('aria-pressed',el.textContent===s.name);
  $('menuBtn').textContent=s.name+' · '+bpm+' bpm';
  $('bpm').value=bpm;$('bpmv').textContent=bpm+' bpm';$('swing').value=s.swing;$('swingv').textContent='swing '+s.swing+'%';
  applyParams();select(sel);renderSeq();
}
const rnd=p=>Math.random()<p;
function randomise(v){
  const o=pat[v];
  for(let i=0;i<16;i++){
    if(v==='kick')o[i]=i%4===0?1:(i===14||i===11)&&rnd(.25)?1:0;
    else if(v==='bass')o[i]=i%4===0?0:rnd(.75)?1:0;
    else if(v==='clap')o[i]=i===4||i===12?1:rnd(.06)?1:0;
    else if(v==='hat')o[i]=rnd(.6)?1:0;
    else if(v==='open')o[i]=i%4===2?(rnd(.85)?1:0):rnd(.05)?1:0;
    else o[i]=rnd(.65)?{d:[0,0,0,0,0,1,2,3,4,5,6,7][Math.random()*12|0],a:rnd(.3),s:rnd(.25)}:null;
  }
}

$('scenes').innerHTML=SCENES.map(s=>`<button>${s.name}</button>`).join(' ');
[...$('scenes').children].forEach((el,i)=>el.onclick=()=>setScene(SCENES[i]));
$('voices').innerHTML=TABS.map(v=>`<button data-v="${v}">${v}</button>`).join(' ');
for(const el of $('voices').children)el.onclick=()=>select(el.dataset.v);
$('bpm').oninput=e=>{bpm=scene.bpm=+e.target.value;$('bpmv').textContent=bpm+' bpm';$('menuBtn').textContent=scene.name+' · '+bpm+' bpm';applyParams()};
$('play').onclick=toggle;
const menu=open=>{$('menu').hidden=!open;$('menuBtn').setAttribute('aria-expanded',open)};
$('menuBtn').onclick=()=>menu($('menu').hidden);
addEventListener('pointerdown',e=>{if(!$('menu').hidden&&!e.target.closest('header'))menu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
$('swing').oninput=e=>{scene.swing=+e.target.value;$('swingv').textContent='swing '+scene.swing+'%'};

/* autosave: patterns, sounds, sequence and switches stay after a reload */
const KEY='techno-function-synth';
function save(){if(resetting)return;try{localStorage.setItem(KEY,JSON.stringify({v:2,scene:SCENES.indexOf(scene),nBars,ON,sel,scenes:SCENES.map(s=>({pat:s.pat,P:s.P,arr:s.arr,bpm:s.bpm,swing:s.swing}))}))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));if(!d||d.v!==2)return 0;
    Object.assign(ON,d.ON);if(DEF[d.sel])sel=d.sel;
    d.scenes.forEach((x,i)=>{const s=SCENES[i];if(!s||!x)return;
      for(const v of TABS){if(x.pat&&Array.isArray(x.pat[v])&&x.pat[v].length===16)s.pat[v]=x.pat[v];if(x.P&&x.P[v])Object.assign(s.P[v],x.P[v]);s.arr[v]=PICK[nBars].map(k=>ARR[v][k]==='x'?1:0)}
      s.bpm=x.bpm||s.bpm;s.swing=x.swing||s.swing});
    for(const el of $('side').children)el.setAttribute('aria-pressed',ON[el.dataset.v]);
    return d.scene||0;
  }catch(e){return 0}
}
let resetting=false;
setInterval(save,1500);addEventListener('pagehide',()=>{if(!resetting)save()});
$('reset').onclick=()=>{resetting=true;localStorage.removeItem(KEY);location.reload()};
$('new').onclick=()=>randomise(sel);

/* ---------- switches and sequence ---------- */
$('side').innerHTML=ROWS.map(v=>`<button class="tg" data-v="${v}" aria-pressed="true" title="show or hide ${v}"><span class="nm">${v}</span><span class="sw"><i></i></span></button>`).join('');
for(const el of $('side').children)el.onclick=()=>{
  const v=el.dataset.v;ON[v]=!ON[v];el.setAttribute('aria-pressed',ON[v]);
  if(v==='acid'&&!ON[v]&&ac)N.vca.gain.setTargetAtTime(0,ac.currentTime,.01);
  if(!ON[v]&&sel===v){const nx=ROWS.find(x=>ON[x]);if(nx)select(nx)}
  renderSeq();
};
function renderSeq(){
  $('seq').style.setProperty('--n',nBars);
  for(const el of $('bars').querySelectorAll('button'))el.setAttribute('aria-pressed',+el.textContent===nBars);
  let h='<div class="lab"></div>'+Array.from({length:nBars},(_,i)=>`<div class="num" data-b="${i}" title="start from bar ${i+1}">${i+1}</div>`).join('');
  for(const v of ROWS)h+=`<div class="lab${ON[v]?'':' off'}">${v}</div>`+scene.arr[v].map((x,i)=>`<div class="c${x?' on':''}${ON[v]?'':' off'}" data-v="${v}" data-b="${i}" title="${v}, bar ${i+1}"></div>`).join('');
  $('seq').innerHTML=h;shownBar=-1;
}
$('bars').insertAdjacentHTML('beforeend',[1,2,4,8,16].map(n=>`<button title="${n===1?'no sequence, just loop the pattern':n+' bar sequence'}">${n}</button>`).join(''));
for(const el of $('bars').querySelectorAll('button'))el.onclick=()=>{nBars=+el.textContent;for(const s of SCENES)arrange(s);bar=bar%nBars;renderSeq()};
$('seq').addEventListener('click',e=>{
  const c=e.target.closest('.c'),n=e.target.closest('.num');
  if(c){const a=scene.arr[c.dataset.v],i=+c.dataset.b;a[i]=a[i]?0:1;c.classList.toggle('on',!!a[i])}
  else if(n)nextBar=+n.dataset.b;   // jump there at the end of this bar (or start there)
});
/* keyboard: a s d f g h j k are the 8 scale notes. Hold several for a chord.
   They write to the step under the caret; ← → move it, backspace clears it. */
const held=new Set();
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)toggle();return}
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
  const k=e.key.toLowerCase(),d=KEYS.indexOf(k);
  if(d>=0){
    e.preventDefault();if(e.repeat)return;
    held.add(d);initAudio();const v=keyVoice();if(!v)return;
    if(sel!==v)select(v);
    const ds=[...held].sort((x,y)=>x-y),old=pat[v][kc];
    pat[v][kc]={d:ds[0],a:old?old.a:false,s:old?old.s:false};if(ds.length>1)pat[v][kc].c=ds;
    preview(v,kc);
  }else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();kc=(kc+(e.key==='ArrowRight'?1:15))%16}
  else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();const v=keyVoice();if(v)pat[v][kc]=null}
});
addEventListener('keyup',e=>{const d=KEYS.indexOf(e.key.toLowerCase());if(d>=0)held.delete(d)});
addEventListener('blur',()=>held.clear());
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault()});
{const i=load();const v=sel;setScene(SCENES[i]);select(v)}draw();
</script>
</body>
</html>
